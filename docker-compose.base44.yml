services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - noten_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=1
      - VITE_BASE44_APP_ID=6acb98f8aef6afdf63fcbf44
      - VITE_BASE44_APP_BASE_URL=https://christoph-plays-notes.base44.app
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure

volumes:
  noten_node_modules:
