name: Deploy Relume site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "relume-mostar-site/**"
      - ".github/workflows/deploy-relume-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relume-mostar-site/package-lock.json
      - name: Install dependencies
        working-directory: relume-mostar-site
        run: npm ci
      - name: Build
        working-directory: relume-mostar-site
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: relume-mostar-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
